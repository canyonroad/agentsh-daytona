# agentsh server configuration for Daytona sandbox
# Updated for agentsh v0.20.2
# Policy-based security mode (relies on default.yaml for enforcement)

server:
  http:
    addr: "127.0.0.1:18080"
    read_timeout: "30s"
    write_timeout: "60s"
    max_request_size: "10MB"
  grpc:
    enabled: true
    addr: "127.0.0.1:9090"

auth:
  type: "none"

logging:
  level: "info"
  format: "json"
  output: "stderr"
  rotation:
    max_size_mb: 100
    max_age_days: 7
    compress: true

sessions:
  base_dir: "/var/lib/agentsh/sessions"
  max_sessions: 100
  default_timeout: "1h"
  default_idle_timeout: "15m"
  cleanup_interval: "5m"

audit:
  enabled: true
  format: "jsonl"
  storage:
    sqlite_path: "/var/lib/agentsh/events.db"
  retention:
    max_age_days: 90

# =============================================================================
# SECURITY CONFIGURATION (v0.20.2)
# =============================================================================

# Simplified security - rely on policy rules in default.yaml
# v0.8.1: Added execve interception with depth-aware policies
# v0.8.9: Added env_inject for operator-controlled variable injection
# v0.9.0: Added dns_redirect and connect_redirect capabilities
# v0.9.3: Agent wrap, cross-platform exec interception
# v0.9.5: Landlock filesystem enforcement (kernel 5.13+)
# v0.9.9: FUSE filesystem interception with deferred mounting
# v0.10.0: BASH_ENV injection for builtin disabling, Landlock execution paths
# v0.17.0: Declared http_services with /svc routing, secret providers
# v0.18.0: Unified http_services declaration, HMAC chain tamper-evidence
# v0.19.0: Per-AF_* socket family blocking (seccomp-bpf with ptrace fallback)
# v0.19.1: Shim-installed kernel enforcement (seccomp wrapper at the kernel layer)
# v0.19.3: Dirty Frag mitigation_sets, protocol-aware socket tuple rules
#          (NOTE: sandbox.seccomp.hardening_profiles was removed -> mitigation_sets)
# v0.20.0: PostgreSQL access proxy, attach-only cgroup mode, eBPF hardening
# v0.20.1: FUSE symlink venv fix + policies.symlink_escape knob, Watchtower PolicyPush
# v0.20.2: opaque shell-c is interception-aware (runs under ptrace/seccomp-execve
#          instead of being pre-denied) + sandbox.seccomp.shellc.opaque knob;
#          config validate hardened; command -v allowed; symlink_escape=deny no
#          longer blanket-denies a symlinked cwd

sandbox:
  enabled: true
  allow_degraded: true

  # v0.20.2: disable the unix-socket exec wrapper. With unix_sockets enabled the
  # v0.19+ shim routes every exec through agentsh-unixwrap, which loads a seccomp
  # filter; in Daytona that load fails (no-new-privileges) and EVERY command exits
  # 1 ("seccomp: filter Load failed ... agentsh-unixwrap"). Disabling it bypasses
  # the wrapper so commands run under the shim + FUSE/Landlock without seccomp.
  unix_sockets:
    enabled: false

  limits:
    max_memory_mb: 4096
    max_cpu_percent: 100
    max_processes: 256

  network:
    enabled: true
    intercept_mode: "all"
    proxy_listen_addr: "127.0.0.1:0"

  # v0.8.1: Seccomp file_monitor can enforce file_rules on ALL paths (including
  # /proc, /sys) via openat/stat interception. However, installing seccomp filters
  # requires privileges that Daytona's container runtime does not grant (the
  # no-new-privileges flag blocks seccomp() syscalls). If Daytona relaxes this,
  # enable the following to block /proc/1/environ reads at the syscall level:
  # seccomp:
  #   file_monitor:
  #     enabled: true
  #     enforce_without_fuse: true
  #     intercept_metadata: true

  # v0.9.9: FUSE filesystem interception with deferred mounting for containers
  # Use /dev/fuse as marker (daytona user is in fuse group, no sudo needed)
  fuse:
    enabled: true
    deferred: true
    deferred_marker_file: "/dev/fuse"
    audit:
      enabled: true
      mode: "soft_delete"
      trash_path: "/home/daytona/.agentsh_trash"

  # v0.9.5: Landlock filesystem enforcement - restrict binary execution paths
  landlock:
    enabled: true
    allow_execute:
      - /usr/bin
      - /bin
      - /usr/local/bin
      - /usr/sbin
      - /sbin
      - /usr/lib
      - /lib
    network:
      allow_connect_tcp: true
      allow_bind_tcp: true

  # v0.20.2: opaque shell-c handling (issue #375 fix).
  # The v0.19+ shim, by default (shellc.opaque=enforce), pre-denies any `bash -c`
  # script it can't statically prove safe (anything with a pipe/redirect/$VAR/etc.)
  # unless runtime execve interception is active. In Daytona we CANNOT enable that
  # interception: seccomp filters can't be installed (no-new-privileges), and the
  # ptrace path also fails because agentsh-unixwrap loads a seccomp prefilter
  # (observed at runtime: "seccomp: filter Load failed ... agentsh-unixwrap").
  # So we permit opaque shell-c to RUN without per-exec enforcement. Still enforced:
  # FUSE file rules, Landlock exec paths, the network proxy, and shim pre-checks on
  # non-opaque commands (sudo/su -> block-shell-escape). Tradeoff: a blocked command
  # hidden *inside* an opaque script is backstopped by the container
  # (no-new-privileges + capability drop), not by agentsh per-exec policy.
  seccomp:
    shellc:
      opaque: allow

  # v0.20.2: ptrace execve enforcement WITH the seccomp prefilter.
  # The prefilter is a basic BPF filter that returns SECCOMP_RET_TRACE only for
  # execve (RET_ERRNO for static denies, RET_ALLOW otherwise), installed with
  # TSYNC -- NOT a NEW_LISTENER user-notify listener. So it does NOT hit the EBUSY
  # listener conflict that blocks the unixwrap seccomp-notify path in Daytona
  # (Daytona's container holds the one allowed user-notify listener; basic filters
  # still stack fine). Benefits over prefilter:false (pure TRACESYSGOOD):
  #   - ptrace is woken only on execve, not every syscall -> no perf cliff
  #   - the filter is inherited across fork/exec -> covers ALL descendants, which
  #     should close the nested-exec leak (xargs/find/python/script -> sudo).
  # unix_sockets stays false to avoid the unixwrap NEW_LISTENER path (which DOES EBUSY).
  ptrace:
    enabled: true
    attach_mode: children
    on_attach_failure: fail_closed
    performance:
      seccomp_prefilter: true
    trace:
      execve: true
      file: false
      network: false
      signal: false

  # v0.8.9: Operator-controlled environment variable injection
  # These bypass env_policy filtering since they're operator-controlled
  env_inject:
    # Ensure agentsh server is always reachable
    AGENTSH_SERVER: "http://127.0.0.1:18080"
    # Activate bash_startup.sh to disable dangerous builtins (kill, enable, ulimit, etc.)
    BASH_ENV: "/usr/lib/agentsh/bash_startup.sh"
    # Daytona workspace variables (operator-controlled)
    # DAYTONA_WS_DIR: "/home/daytona/workspace"

proxy:
  mode: "embedded"
  port: 0
  providers:
    anthropic: "https://api.anthropic.com"
    openai: "https://api.openai.com"

dlp:
  mode: "redact"
  patterns:
    email: true
    phone: true
    credit_card: true
    ssn: true
    api_keys: true
  custom_patterns:
    - name: openai_key
      display: OPENAI_KEY
      regex: "sk-[a-zA-Z0-9]{48,}"
    - name: anthropic_key
      display: ANTHROPIC_KEY
      regex: "sk-ant-[a-zA-Z0-9-]{95,}"
    - name: aws_access_key
      display: AWS_KEY
      regex: "AKIA[0-9A-Z]{16}"
    - name: github_pat
      display: GITHUB_TOKEN
      regex: "ghp_[a-zA-Z0-9]{36}"
    - name: github_oauth
      display: GITHUB_OAUTH
      regex: "gho_[a-zA-Z0-9]{36}"
    - name: jwt_token
      display: JWT
      regex: "eyJ[a-zA-Z0-9_-]*\\.eyJ[a-zA-Z0-9_-]*\\.[a-zA-Z0-9_-]*"
    - name: private_key
      display: PRIVATE_KEY
      regex: "-----BEGIN [A-Z]+ PRIVATE KEY-----"
    - name: slack_token
      display: SLACK_TOKEN
      regex: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"
    - name: daytona_api_key
      display: DAYTONA_KEY
      regex: "dtn_[a-zA-Z0-9]{64}"
    - name: google_api_key
      display: GOOGLE_KEY
      regex: "AIza[0-9A-Za-z\\-_]{35}"

policies:
  dir: "/etc/agentsh/policies"
  default: "default"
  # v0.20.1: How to treat symlinks whose targets resolve outside the sandbox root.
  #   "evaluate" (new default) follows the link and checks the target against
  #     file_rules; "deny" is a blanket-deny of any such symlink.
  # MUST be "evaluate" here: Daytona's /home/daytona working dir is itself reached
  # via a symlink that escapes the FUSE workspace mount, so "deny" blocks EVERY
  # command at cwd resolution (rule=workspace-escape). The resolved target is still
  # checked against file_rules, so sensitive reads stay blocked.
  symlink_escape: evaluate
  project_markers:
    - ".git"
    - "package.json"
    - "Cargo.toml"
    - "go.mod"
    - "pyproject.toml"
    - "requirements.txt"

approvals:
  enabled: false
  mode: "async"
  timeout: "5m"

metrics:
  enabled: true
  path: "/metrics"

health:
  path: "/health"
  readiness_path: "/ready"

development:
  disable_auth: true
  verbose_errors: false
